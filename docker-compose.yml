version: '3.8'

services:
  # Worker Service
  # Conecta na infraestrutura existente (Postgres, MinIO, WireMock) da API
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortsmaker-worker
    restart: unless-stopped
    environment:
      # ==================== DATABASE ====================
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/shortsmaker
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      
      # ==================== WORKER CONFIG ====================
      WORKER_POLL_INTERVAL: 5
      WORKER_MAX_RETRIES: 3
      SCRIPT_WORKERS_COUNT: 2
      AUDIO_WORKERS_COUNT: 2
      VIDEO_WORKERS_COUNT: 1
      VTT_WORKERS_COUNT: 2
      
      # ==================== LLM (TEXT) ====================
      LLM_TEXT_PROVIDER: gemini  # openai ou gemini
      
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: http://wiremock:8080  # Para mocks/testes
      OPENAI_MODEL_TEXT: gpt-4o
      
      # Gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_TEXT: gemini-2.0-flash-exp
      
      # ==================== VIDEO ====================
      VIDEO_PROVIDER: gemini  # gemini, stability
      GEMINI_MODEL_VIDEO: veo-003
      
      # ==================== IMAGE ====================
      IMAGE_PROVIDER: openai  # openai, gemini, stability
      OPENAI_MODEL_IMAGE: dall-e-3
      
      # ==================== AUDIO ====================
      AUDIO_PROVIDER: elevenlabs  # placeholder, elevenlabs, openai
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
      ELEVENLABS_MODEL: eleven_multilingual_v2
      
      # ==================== STORAGE ====================
      STORAGE_PROVIDER: minio  # minio ou supabase
      
      # MinIO (conecta no MinIO da API)
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: shortsmaker
      MINIO_SECURE: "false"
      MINIO_REGION: us-east-1
      
      # ==================== LOGGING ====================
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      
    volumes:
      - ./app:/app/app  # Hot reload durante desenvolvimento
      
    depends_on:
      - postgres
      - minio
      - wiremock
      
    networks:
      - shortsmaker-network

# ========================================
# NETWORKS
# ========================================
# Conecta na network existente criada pela API
# A API deve ter criado essa network com:
# docker network create shortsmaker-network
networks:
  shortsmaker-network:
    external: true
    name: shortsmaker-network
